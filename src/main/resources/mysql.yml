spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL:jdbc:mysql://localhost:13306/app_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DATABASE_USER:app_user}
    password: ${DATABASE_PASSWORD:app_password}
    hikari:
      max-lifetime: 270000        # 270s (< MySQL wait_timeout 300s)
      keepalive-time: 60000       # 60s 마다 SELECT 1로 유효성 검증
      idle-timeout: 240000        # 240s (< MySQL wait_timeout 300s)
      connection-timeout: 5000
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}

---
spring.config.activate.on-profile: local

logging:
  level:
    org.hibernate.sql: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari.HikariConfig: DEBUG
    com.mysql.cj: DEBUG
